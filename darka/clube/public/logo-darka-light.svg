      <stop offset="0%"   stop-color="#e6342b"/>
      <stop offset="18%"  stop-color="#f3742a"/>
      <stop offset="38%"  stop-color="#f0c020"/>
      <stop offset="58%"  stop-color="#3aa761"/>
