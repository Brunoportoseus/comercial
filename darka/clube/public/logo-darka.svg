<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logo Tintas Darka — reconstrução vetorial fiel.
  Faixa ondulada multicolor (vermelho → laranja → amarelo → verde →
  azul → roxo) sobre tipografia em verde institucional Darka.
  Substitua por SVG/PNG oficial do cliente quando disponível.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="Tintas Darka">
  <defs>
    <linearGradient id="d-ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e6342b"/>
      <stop offset="20%"  stop-color="#f3742a"/>
      <stop offset="40%"  stop-color="#f0c020"/>
      <stop offset="60%"  stop-color="#3aa761"/>
      <stop offset="80%"  stop-color="#3aa1d9"/>
      <stop offset="100%" stop-color="#3a4a9e"/>
    </linearGradient>
  </defs>

  <!-- Faixa ondulada estilo bandeira ao vento -->
  <path
    d="M14,72
       C 45,40 75,40 110,62
       C 145,84 175,84 210,58
       L 206,108
       C 175,134 145,134 110,112
       C 75,90 45,90 18,118 Z"
    fill="url(#d-ribbon)"/>

  <!-- TINTAS -->
  <text x="110" y="160"
        text-anchor="middle"
        font-family="'Sora','Inter',Arial,sans-serif"
        font-weight="700"
        font-size="22"
        letter-spacing="3"
        fill="#0d6b4d">TINTAS</text>

  <!-- DARKA — destaque -->
  <text x="110" y="200"
        text-anchor="middle"
        font-family="'Sora','Inter',Arial,sans-serif"
        font-weight="800"
        font-size="42"
        letter-spacing="1"
        fill="#0d6b4d">DARKA</text>
</svg>
