<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  .card{position:relative;width:1200px;height:630px;
    font-family:Georgia,'Times New Roman',serif;color:#fff;
    background:
      radial-gradient(900px 420px at 50% -12%, rgba(233,184,74,.6), transparent 62%),
      linear-gradient(165deg,#0b4f70 0%, #12729a 48%, #1f93b8 100%);
    overflow:hidden}
  .waves{position:absolute;left:0;bottom:-2px;width:1200px;height:150px;fill:#f6efe2}
  .inner{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:0 70px}
  .eyebrow{font-family:'Segoe UI',Arial,sans-serif;text-transform:uppercase;
    letter-spacing:.28em;font-size:20px;font-weight:700;color:#dff1f8;opacity:.9;
    margin-bottom:22px}
  .title{font-size:82px;font-weight:700;line-height:1.02;letter-spacing:-1px;
    text-shadow:0 4px 22px rgba(0,0,0,.28)}
  .amp{color:#e9b84a}
  .sub{font-family:'Segoe UI',Arial,sans-serif;font-size:24px;font-weight:600;
    color:#ffe6c2;margin-top:20px;letter-spacing:.02em}
  .dates{font-family:'Segoe UI',Arial,sans-serif;font-size:22px;font-weight:600;
    color:#eaf6fb;margin-top:10px;opacity:.95}
  .names{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:34px;
    max-width:1000px}
  .chip{font-family:'Segoe UI',Arial,sans-serif;font-size:22px;font-weight:700;
    background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.34);
    padding:9px 22px;border-radius:999px;backdrop-filter:blur(2px)}
  .icons{position:absolute;z-index:2;top:40px;left:0;right:0;text-align:center;
    font-size:34px;letter-spacing:14px}
  .foot{font-family:'Segoe UI',Arial,sans-serif;position:absolute;z-index:3;
    bottom:30px;left:0;right:0;text-align:center;font-size:18px;font-weight:600;
    color:#0e5a7d}
</style>
</head>
<body>
  <div class="card">
    <div class="icons">🚤&nbsp;&nbsp;🐬&nbsp;&nbsp;⛴️&nbsp;&nbsp;🏝️&nbsp;&nbsp;🎆</div>
    <div class="inner">
      <div class="eyebrow">Southern Coast of São Paulo · Brazil</div>
      <div class="title">Cananéia <span class="amp">&amp;</span> Ilha Comprida</div>
      <div class="sub">Travel Itinerary · Roteiro de Viagem</div>
      <div class="dates">December 30, 2026 – January 2, 2027</div>
      <div class="names">
        <span class="chip">Renata</span>
        <span class="chip">Alex</span>
        <span class="chip">Bruno</span>
        <span class="chip">Chris</span>
        <span class="chip">Fer</span>
        <span class="chip">Dani</span>
      </div>
    </div>
    <svg class="waves" viewBox="0 0 1200 150" preserveAspectRatio="none">
      <path d="M0,80 C200,30 400,120 600,80 C800,40 1000,120 1200,80 L1200,150 L0,150 Z" opacity="0.55"/>
      <path d="M0,105 C200,60 400,140 600,105 C800,65 1000,140 1200,105 L1200,150 L0,150 Z"/>
    </svg>
    <div class="foot">A New Year's trip for 6 · Nature, history &amp; Caiçara culture</div>
  </div>
</body>
</html>
