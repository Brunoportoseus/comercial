    <rect x="10" y="26" width="5.5" height="9"  rx="1.4" fill="#0B1829" opacity="0.55"/>
    <rect x="19.25" y="20" width="5.5" height="15" rx="1.4" fill="#0B1829" opacity="0.78"/>
    <rect x="28.5" y="12" width="5.5" height="23" rx="1.4" fill="#0B1829"/>
    <path d="M10 12 L20 12" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
  </g>
  <!-- Wordmark -->
  <text x="54" y="29" font-family="'DM Serif Display', Georgia, serif" font-size="22" fill="#ffffff">Porto <tspan fill="#13BDA8" font-style="italic">&amp;</tspan> Feiges</text>
